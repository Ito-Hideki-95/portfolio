<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="certificate-title certificate-description" xml:lang="ja">
  <title id="certificate-title">認定証・会員証システムの機能構成図</title>
  <desc id="certificate-description">CSV一括取込、会員ログイン、PDF認定証、QRコード照合と、運用マニュアルの構成イメージです。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081c37"/><stop offset="1" stop-color="#014f93"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b4dfff" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <circle cx="1260" cy="120" r="300" fill="#42c5ec" opacity=".05"/>
  <g font-family="'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', Meiryo, system-ui, sans-serif">
    <text x="84" y="103" font-size="22" letter-spacing="3" fill="#72d7f3">機能構成図</text>
    <text x="84" y="174" font-size="46" font-weight="700" fill="#fff">認定証の発行と確認を、ひとつの仕組みに。</text>
    <text x="84" y="224" font-size="24" fill="#aac9e6">会員データの取込から、認定証の発行・第三者による確認まで</text>

    <rect x="84" y="330" width="270" height="194" rx="24" fill="#102e4e" stroke="#508bb5"/>
    <text x="112" y="374" font-size="20" fill="#63cee7">01</text>
    <text x="112" y="427" font-size="32" font-weight="700" fill="#fff">CSV一括取込</text>
    <text x="112" y="476" font-size="22" fill="#b5cde2">会員情報を一括登録</text>
    <path d="M366 425h40m-12-9 12 9-12 9" fill="none" stroke="#75dbed" stroke-width="3"/>

    <rect x="418" y="330" width="270" height="194" rx="24" fill="#102e4e" stroke="#508bb5"/>
    <text x="446" y="374" font-size="20" fill="#63cee7">02</text>
    <text x="446" y="427" font-size="32" font-weight="700" fill="#fff">会員ログイン</text>
    <text x="446" y="476" font-size="22" fill="#b5cde2">会員ごとのアクセス</text>
    <path d="M700 425h40m-12-9 12 9-12 9" fill="none" stroke="#75dbed" stroke-width="3"/>

    <rect x="752" y="330" width="270" height="194" rx="24" fill="#102e4e" stroke="#508bb5"/>
    <text x="780" y="374" font-size="20" fill="#63cee7">03</text>
    <text x="780" y="427" font-size="32" font-weight="700" fill="#fff">PDF認定証</text>
    <text x="780" y="476" font-size="22" fill="#b5cde2">認定証を発行</text>
    <path d="M1034 425h40m-12-9 12 9-12 9" fill="none" stroke="#75dbed" stroke-width="3"/>

    <rect x="1086" y="330" width="270" height="194" rx="24" fill="#102e4e" stroke="#508bb5"/>
    <text x="1114" y="374" font-size="20" fill="#63cee7">04</text>
    <text x="1114" y="427" font-size="32" font-weight="700" fill="#fff">QRコード照合</text>
    <text x="1114" y="476" font-size="22" fill="#b5cde2">第三者による確認</text>

    <rect x="84" y="602" width="1272" height="142" rx="24" fill="#fff" fill-opacity=".06" stroke="#80b9e7" stroke-opacity=".3"/>
    <text x="118" y="655" font-size="27" font-weight="700" fill="#fff">納品後の運用を支える操作マニュアル</text>
    <text x="118" y="701" font-size="24" fill="#bdd3e7">操作手順・文言やリンク先の変更方法・トラブル時の対応</text>
    <path d="M84 810H1356" stroke="#80b9e7" stroke-opacity=".3"/>
    <text x="84" y="852" font-size="20" fill="#abcce7">会員証・認定証システム</text>
    <text x="1356" y="852" text-anchor="end" font-size="20" fill="#abcce7">機能の構成イメージ</text>
  </g>
</svg>
