<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="backend-title backend-description" xml:lang="ja">
  <title id="backend-title">設計から最終納品まで完了したバックエンド開発の技術構成図</title>
  <desc id="backend-description">組織ごとの権限制御、トランザクションと異常時の処理停止、操作と変更の監査ログ、サーバーでのSHA-256によるファイル照合、データベース移行と回帰テストを示す構成イメージです。各項目は処理の順序を示すものではありません。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081c37"/><stop offset="1" stop-color="#014f93"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b4dfff" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <circle cx="1260" cy="120" r="300" fill="#42c5ec" opacity=".05"/>
  <g font-family="'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', Meiryo, system-ui, sans-serif">
    <text x="84" y="103" font-size="22" letter-spacing="3" fill="#72d7f3">機能構成図</text>
    <text x="84" y="174" font-size="46" font-weight="700" fill="#fff">権限・記録・整合性を、仕組みで守る。</text>
    <text x="84" y="224" font-size="24" fill="#aac9e6">バックエンドの設計・実装・検証・最終納品まで完了</text>

    <g id="access-control">
      <rect x="84" y="330" width="400" height="194" rx="24" fill="#102e4e" stroke="#508bb5"/>
      <text x="112" y="374" font-size="22" fill="#63cee7">RLS・最小権限</text>
      <text x="112" y="427" font-size="34" font-weight="700" fill="#fff">権限制御</text>
      <text x="112" y="476" font-size="24" fill="#b5cde2">組織ごとのアクセス制御</text>
    </g>

    <g id="transaction-integrity">
      <rect x="520" y="330" width="400" height="194" rx="24" fill="#102e4e" stroke="#508bb5"/>
      <text x="548" y="374" font-size="22" fill="#63cee7">トランザクション・状態制御</text>
      <text x="548" y="427" font-size="34" font-weight="700" fill="#fff">処理の整合性</text>
      <text x="548" y="476" font-size="24" fill="#b5cde2">異常時は処理を停止</text>
    </g>

    <g id="audit-log">
      <rect x="956" y="330" width="400" height="194" rx="24" fill="#102e4e" stroke="#508bb5"/>
      <text x="984" y="374" font-size="22" fill="#63cee7">操作・変更履歴</text>
      <text x="984" y="427" font-size="34" font-weight="700" fill="#fff">監査ログ</text>
      <text x="984" y="476" font-size="24" fill="#b5cde2">操作と変更の履歴を記録</text>
    </g>

    <g id="file-integrity">
      <rect x="84" y="602" width="600" height="142" rx="24" fill="#fff" fill-opacity=".06" stroke="#80b9e7" stroke-opacity=".3"/>
      <text x="118" y="655" font-size="32" font-weight="700" fill="#fff">ファイルの整合性検証</text>
      <text x="118" y="701" font-size="24" fill="#bdd3e7">実ファイルのSHA-256をサーバーで照合</text>
    </g>
    <g id="migration-regression">
      <rect x="716" y="602" width="640" height="142" rx="24" fill="#fff" fill-opacity=".06" stroke="#80b9e7" stroke-opacity=".3"/>
      <text x="750" y="655" font-size="32" font-weight="700" fill="#fff">移行・回帰テスト</text>
      <text x="750" y="701" font-size="24" fill="#bdd3e7">DB移行手順・検証SQL・テスト資料</text>
    </g>
    <path d="M84 810H1356" stroke="#80b9e7" stroke-opacity=".3"/>
    <text x="84" y="852" font-size="22" fill="#abcce7">PostgreSQL・Supabase</text>
    <text x="1356" y="852" text-anchor="end" font-size="22" fill="#abcce7">機能の構成イメージ</text>
  </g>
</svg>
